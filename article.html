/* =====================================================
   LANGUAGE AND ARTICLE RENDERING
===================================================== */

let language = "en";

function renderArticle() {

  const params = new URLSearchParams(window.location.search);

  const articleId = params.get("id") || "back-pain";

  const article = articles[articleId];

  const title = document.getElementById("title");
  const content = document.getElementById("content");
  const category = document.getElementById("category");
  const languageButton = document.getElementById("languageButton");
  const backLink = document.getElementById("backLink");
  const disclaimer = document.getElementById("disclaimer");

  if (!article) {

    document.documentElement.lang = language;
    document.documentElement.dir =
      language === "ar" ? "rtl" : "ltr";

    category.textContent = "";

    title.textContent =
      language === "en"
        ? "Article not found"
        : "المقال غير موجود";

    content.textContent =
      language === "en"
        ? "Please return to the articles page."
        : "من فضلك ارجع إلى صفحة المقالات.";

    return;
  }

  const index = language === "en" ? 0 : 1;

  document.documentElement.lang = language;

  document.documentElement.dir =
    language === "ar" ? "rtl" : "ltr";

  category.textContent = article.category[index];

  title.textContent = article.title[index];

  content.replaceChildren();

  article.sections.forEach(function(section) {

    const heading = document.createElement("h2");
    heading.textContent = section[index];

    const paragraph = document.createElement("p");
    paragraph.textContent = section[index + 2];

    content.appendChild(heading);
    content.appendChild(paragraph);

  });

  languageButton.textContent =
    language === "en" ? "العربية" : "English";

  backLink.textContent =
    language === "en"
      ? "← Back to articles"
      : "العودة إلى المقالات ←";

  disclaimer.textContent =
    language === "en"
      ? "Medical Disclaimer: This article is for educational purposes only. It does not replace professional medical assessment, diagnosis or individualized treatment."
      : "تنويه طبي: هذا المقال مخصص للتثقيف الصحي فقط، ولا يُغني عن التقييم الطبي المتخصص أو التشخيص أو الخطة العلاجية الفردية.";

  document.title = article.title[index] + " | Pure Physio";

}


/* =====================================================
   LANGUAGE BUTTON
===================================================== */

document
  .getElementById("languageButton")
  .addEventListener("click", function() {

    language = language === "en" ? "ar" : "en";

    renderArticle();

  });


/* =====================================================
   FOOTER YEAR
===================================================== */

document.getElementById("year").textContent =
  new Date().getFullYear();


/* =====================================================
   INITIAL RENDER
===================================================== */

renderArticle();
