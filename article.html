let language = "en";

function renderArticle(){
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");
  const article = articles[id];

  const title = document.getElementById("title");
  const content = document.getElementById("content");
  const category = document.getElementById("category");

  if(!article){
    title.textContent = language === "en"
      ? "Article not found"
      : "المقال غير موجود";
    category.textContent = "";
    content.textContent = language === "en"
      ? "Please return to the articles page and choose an article."
      : "من فضلك ارجع إلى صفحة المقالات واختر مقالًا.";
    return;
  }

  const i = language === "en" ? 0 : 1;

  document.documentElement.lang = language;
  document.documentElement.dir = language === "ar" ? "rtl" : "ltr";

  category.textContent = article.category[i];
  title.textContent = article.title[i];
  document.title = article.title[i] + " | Pure Physio";

  content.replaceChildren();

  article.sections.forEach(section => {
    const heading = document.createElement("h2");
    heading.textContent = section[i];

    const paragraph = document.createElement("p");
    paragraph.textContent = section[i + 2];

    content.appendChild(heading);
    content.appendChild(paragraph);
  });

  document.getElementById("languageButton").textContent =
    language === "en" ? "العربية" : "English";

  document.getElementById("backLink").textContent =
    language === "en" ? "← Back to articles" : "العودة إلى المقالات ←";

  document.getElementById("backLink").href = "index.html#articles";
}

document.getElementById("languageButton").addEventListener("click", () => {
  language = language === "en" ? "ar" : "en";
  renderArticle();
});

document.getElementById("year").textContent = new Date().getFullYear();

renderArticle();
</script>
